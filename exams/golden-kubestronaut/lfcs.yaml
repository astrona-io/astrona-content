# Linux Foundation Certified System Administrator — public exam definition.
# Question banks are not here and never will be: this repository is public.
long_name: Linux Foundation Certified System Administrator
status: in_test
pass_score: 75
max_breaks: 3
description: |-
  The Linux Foundation Certified System Administrator (LFCS) certification validates your ability to administer Linux systems in real-world environments. It’s designed for engineers who want to prove hands-on skills in managing Linux servers — a critical foundation for Kubernetes, cloud, and platform engineering roles.

  LFCS is a hands-on, performance-based exam completed in a live Linux environment. You are tested on system configuration, user and permission management, networking, storage, process management, services, security basics, and troubleshooting. There are no multiple-choice questions — every task requires direct command-line execution under time pressure.

  Many candidates fail LFCS not because they lack knowledge, but because they struggle with speed, accuracy, and practical workflows. Knowing commands isn’t enough — you must apply them correctly and efficiently.

  Using LFCS simulator exams helps you practice in realistic environments, build muscle memory, improve time management, and stay calm under exam conditions. Simulator-based preparation significantly increases your chances of passing on the first attempt and prepares you for real production responsibilities.

  Master Linux fundamentals. Operate with confidence. Pass LFCS.
domains:
- name: Operations Deployment
  weight: 25
  description: |-
    Configure kernel parameters, persistent and non-persistent
    Diagnose, identify, manage, and troubleshoot processes and services
    Manage or schedule jobs for executing commands
    Search for, install, validate, and maintain software packages or repositories
    Recover from hardware, operating system, or filesystem failures
    Manage Virtual Machines (libvirt)
    Configure container engines, create and manage containers
    Create and enforce MAC using SELinux
- name: Networking
  weight: 25
  description: |-
    Configure IPv4 and IPv6 networking and hostname resolution
    Set and synchronize system time using time servers
    Monitor and troubleshoot networking
    Configure the OpenSSH server and client
    Configure packet filtering, port redirection, and NAT
    Configure static routing
    Configure bridge and bonding devices
    Implement reverse proxies and load balancers
- name: Storage
  weight: 20
  description: |-
    Configure and manage LVM storage
    Manage and configure the virtual file system
    Create, manage, and troubleshoot filesystems
    Use remote filesystems and network block devices
    Configure and manage swap space
    Configure filesystem automounters
    Monitor storage performance
- name: Essential Commands
  weight: 20
  description: |-
    Basic Git Operations
    Create, configure, and troubleshoot services
    Monitor and troubleshoot system performance and services
    Determine application and service specific constraints
    Troubleshoot diskspace issues
    Work with SSL certificates
- name: Users and Groups
  weight: 10
  description: |-
    Create and manage local user and group accounts
    Manage personal and system-wide environment profiles
    Configure user resource limits
    Configure and manage ACLs
    Configure the system to use LDAP user and group accounts
